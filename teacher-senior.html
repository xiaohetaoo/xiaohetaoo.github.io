  <!-- 独立主题页（音乐）：自包含（无站点样式/脚本/导航/主题按钮），纯 CSS 氛围。
       两条弯曲的五线谱缎带（暖褐、线距 11）常驻；彩色音符用 offset-path 沿谱带路径
       行进（offset-rotate: auto 自动随坡度旋转），因此音符始终"顺着五线谱流动"。
       停动画（reduced-motion）时音符按各自的 --dist 静态停在谱线上。 -->
  <style>
    :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); --ink: #f4ecff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Roboto", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(130% 100% at 50% 118%, #3d1246 0%, #1d1036 42%, #0c0718 100%);
    }
    .stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    /* 暗角柔光 */
    .blob { position: absolute; border-radius: 50%; pointer-events: none; }
    .blob.b1 { left: -8%; top: -12%; width: 46vw; height: 46vw;
      background: radial-gradient(circle, rgba(224, 102, 255, 0.18), transparent 68%); }
    .blob.b2 { right: -10%; top: 6%; width: 42vw; height: 42vw;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.16), transparent 68%); }
    .blob.b3 { left: 22%; bottom: -18%; width: 52vw; height: 52vw;
      background: radial-gradient(circle, rgba(224, 102, 255, 0.13), transparent 70%); }

    /* 谱带与音符同一张 SVG，保证音符落在线上且不被拉伸 */
    .staff-art { position: absolute; inset: 0; width: 100%; height: 100%; }

    .staff-line {
      fill: none;
      stroke: #9a7154;
      stroke-width: 3.4;
      stroke-linecap: round;
      opacity: 0.8;
    }
    .staff-line.soft { opacity: 0.5; }

    /* 音符默认不画：浏览器不支持 motion path 时，否则会全叠在原点 */
    .note-flow { display: none; }

    @supports (offset-path: path("M0 0")) {
      .note-flow {
        display: inline;
        /* 百分比要相对音符自己的盒子算，否则 offset-anchor 会按整个 viewBox 解析 */
        transform-box: fill-box;
        offset-rotate: auto;
        offset-distance: var(--dist, 0%);
        /* --lift 让音符落在谱带的不同线上（±22 / ±11 / 0） */
        transform: translateY(var(--lift, 0px));
        animation: ride var(--dur, 30s) linear var(--delay, 0s) infinite;
      }
      /* 关键：锚点定在"音符头"上（n8 在 27%/81%，n16 在首个音符头 17%/83%），
         否则默认锚点是包围盒中心，音符会整体偏到谱带下方 */
      .note-flow[href="#n8"] { offset-anchor: 33% 80%; }
      .note-flow[href="#n16"] { offset-anchor: 21% 82%; }
      @keyframes ride {
        0%   { offset-distance: 0%; opacity: 0; }
        7%   { opacity: var(--o, 0.92); }
        90%  { opacity: var(--o, 0.92); }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .note-flow { animation: none !important; opacity: var(--o, 0.92); }
      }
    }

    .note-flow.r1 { offset-path: path("M-60,380 C120,380 200,180 400,180 C600,180 620,380 780,400 C900,415 980,320 1080,250"); }
    .note-flow.r2 { offset-path: path("M-100,560 C100,540 220,430 420,430 C620,430 680,540 860,540 C960,540 1040,470 1120,430"); }

    /* 诗：柔和暗底保证对比度 */
    .scene-copy { position: relative; z-index: 4; width: min(92vw, 560px); }
    .scene-copy::before {
      content: "";
      position: absolute;
      inset: -70% -55%;
      z-index: -1;
      /* closest-side = 内切椭圆，淡出落在盒内，避免被盒子裁出直边（同山顶页的"矩形蒙版"问题） */
      background: radial-gradient(closest-side at 50% 50%, rgba(12, 7, 24, 0.8), rgba(12, 7, 24, 0.44) 58%, transparent 100%);
      filter: blur(12px);
    }
    .scene-copy > * { animation: rise 0.9s var(--ease) both; }
    .scene-copy > *:nth-child(1) { animation-delay: 0.14s; }
    .scene-copy > *:nth-child(2) { animation-delay: 0.3s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    .scene-title {
      margin-bottom: 16px;
      font-size: clamp(24px, 3.8vw, 37px);

    .poem span { display: block; }
    .poem span + span.stanza { margin-top: 0.9em; }

    /* 左上角：返回上一页（触控目标 ≥44px） */
    .scene-back {

      border: 1px solid rgba(255, 255, 255, 0.2);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
    }
    .scene-back:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.34); transform: translateY(-1px); }
    .scene-back:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.75); outline-offset: 3px; }
    .scene-back svg { width: 15px; height: 15px; }
